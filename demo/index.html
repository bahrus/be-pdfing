<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>be-pdfing demo</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-pdfing/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1rem; }
        .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        textarea { width: 100%; height: 18rem; font-family: monospace; font-size: 0.8rem; tab-size: 4; }
        pre { background: #f4f4f4; padding: 0.5rem; overflow: auto; max-height: 30rem; font-size: 0.75rem; tab-size: 12; }
        table { border-collapse: collapse; font-size: 0.8rem; margin-bottom: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.15rem 0.4rem; text-align: left; }
        #codeError { color: crimson; }
    </style>
</head>
<body>
    <h1>be-pdfing</h1>
    <p>
        Pick a PDF (try <code>demo/home-school-transcript-example.pdf</code> or
        <code>demo/sample-transcript.pdf</code>).  Edit the handler or rules to re-apply them to the
        extracted lines without re-reading the file.
    </p>
    <input id="picker" type="file" accept=".pdf" be-pdfing>
    <div class="panes">
        <section>
            <h2>Handler / rules</h2>
            <select id="preset">
                <option value="homeHandler">Home-school transcript: handler</option>
                <option value="sampleHandler">Sample transcript: handler</option>
                <option value="homeRules">Home-school transcript: rules</option>
                <option value="sampleRules">Sample transcript: rules</option>
                <option value="none">None (lines only)</option>
            </select>
            <p><small id="codeHint"></small></p>
            <textarea id="codeText" spellcheck="false"></textarea>
            <div id="codeError"></div>
            <h2>Records</h2>
            <div id="records"></div>
        </section>
        <section>
            <h2>Lines <small>(cells separated by tabs)</small></h2>
            <pre id="lines"></pre>
        </section>
    </div>
    <script type=module>
        const presets = {
            homeHandler: {kind: 'handler', code: String.raw`const {tables, valueAfter, num} = helpers;
return {
    student: valueAfter(lines, 'Student:'),
    courses: tables(lines, {
        header: /Grade (?<gradeLevel>\d+)\tGr\tCr/,
        until: /^GPA/,
        columns: ['course', 'grade', 'credits'],
    }).flatMap(({header, rows}) => rows.map(row => ({
        gradeLevel: num(header.gradeLevel), ...row, credits: num(row.credits),
    }))),
};`},
            sampleHandler: {kind: 'handler', code: String.raw`const {tables, valueAfter, num} = helpers;
const courses = [];
for(const table of tables(lines, {
    header: /Code\tCODE\tDescription\tGrade\tEarn\t(?:Cred )?Attp\tDSG/,
    until: /Report Period/,
    columns: ['stateCode', 'courseCode', 'description', 'grade', 'credEarn', 'credAttp', 'dsg'],
})){
    let term;
    for(const [i, row] of table.rows.entries()){
        const heading = /MO\/YR: (\S+)\t(?:GRD )?LEV: (\d+)/.exec(table.lines[i].text);
        if(heading !== null){
            term = {moYr: heading[1], gradeLevel: heading[2]};
        }else if(term !== undefined && /^\d{5}$/.test(row.stateCode)){
            courses.push({...term, ...row, credEarn: num(row.credEarn), credAttp: num(row.credAttp)});
        }
    }
}
return {
    student: valueAfter(lines, 'LEGAL NAME (Last, First, Middle)', {below: true}),
    courses,
};`},
            homeRules: {kind: 'rules', rules: [
                {pattern: String.raw`Student:\t(?<student>[^\t]+)`, sets: 'document'},
                {pattern: String.raw`Grade (?<gradeLevel>\d+)\tGr\tCr`, sets: true},
                {pattern: String.raw`(?<course>[^\t]+)\t(?<grade>[A-F][+-]?|P)\t(?<credits>\d+(?:\.\d+)?)`, emits: 'courses'},
            ]},
            sampleRules: {kind: 'rules', rules: [
                {pattern: String.raw`MO/YR: (?<moYr>\d\d/\d{4})\t(?:GRD )?LEV: (?<gradeLevel>\d+)`, sets: true},
                {pattern: String.raw`(?<stateCode>\d{5})\t(?<courseCode>[^\t]+)\t(?<description>[^\t]+)\t(?<grade>[A-F][+-]?|P|W|I)\t(?<credEarn>\d+\.\d+)\t(?<credAttp>\d+\.\d+)(?:\t(?<dsg>[A-Z]{1,4})\b)?`, emits: 'courses'},
                {pattern: String.raw`Cumulative\t(?<credEarn>[\d.]+)\t(?<credAttp>[\d.]+)\t(?<gpaPts>[\d.]+)\t(?<gpa>[\d.]+)`, emits: 'totals'},
            ]},
            none: {kind: 'rules', rules: []},
        };

        function applyCode(){
            const {kind} = presets[preset.value];
            const bePdfing = picker.enh.bePdfing;
            try{
                if(kind === 'handler'){
                    const handler = new Function('{file, numPages, lines, records, helpers}', codeText.value);
                    codeError.textContent = '';
                    bePdfing.rules = [];
                    bePdfing.handler = handler;
                }else{
                    const rules = JSON.parse(codeText.value);
                    rules.forEach(r => new RegExp(r.pattern, r.flags));
                    codeError.textContent = '';
                    bePdfing.handler = undefined;
                    bePdfing.rules = rules;
                }
            }catch(e){
                codeError.textContent = e.message;
            }
        }
        function loadPreset(){
            const p = presets[preset.value];
            codeHint.textContent = p.kind === 'handler'
                ? 'The body of handler({file, numPages, lines, records, helpers}), which returns the records.'
                : 'The rules, as JSON.';
            codeText.value = p.kind === 'handler' ? p.code : JSON.stringify(p.rules, null, 2);
            applyCode();
        }
        preset.addEventListener('change', loadPreset);
        codeText.addEventListener('input', applyCode);

        picker.addEventListener('load', e => {
            if(e.enh !== 'bePdfing') return;
            const [result] = e.results;
            if(result === undefined) return;
            lines.textContent = result.lines.map(l => `p${l.page} ${String(l.y).padStart(5)}  ${l.text}`).join('\n');
            records.replaceChildren();
            for(const [name, value] of Object.entries(result.records ?? {})){
                const caption = document.createElement('h3');
                if(!Array.isArray(value)){
                    caption.textContent = `${name}: ${JSON.stringify(value)}`;
                    records.append(caption);
                    continue;
                }
                caption.textContent = `${name} (${value.length})`;
                const table = document.createElement('table');
                const keys = [...new Set(value.flatMap(Object.keys))];
                const head = table.createTHead().insertRow();
                for(const key of keys){
                    const th = document.createElement('th');
                    th.textContent = key;
                    head.append(th);
                }
                const body = table.createTBody();
                for(const row of value){
                    const tr = body.insertRow();
                    for(const key of keys) tr.insertCell().textContent = row[key] ?? '';
                }
                records.append(caption, table);
            }
        });
        picker.addEventListener('error', e => { codeError.textContent = `Error (${e.file.name}): ${e.error}`; });

        // The enhancement attaches asynchronously; wait for it before setting the handler/rules.
        (function whenReady(){
            if(picker.enh?.bePdfing?.resolved) return loadPreset();
            requestAnimationFrame(whenReady);
        })();
    </script>
</body>
</html>
